<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared playlist — REELTRACK</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/">REEL<span>TRACK</span></a><a href="/">Back to REELTRACK ↗</a></header><main class="section"><p class="eyebrow">A REELTRACK COLLECTION</p><h2 id="title">Loading playlist…</h2><p id="description" class="sub"></p><div id="movies" class="movie-grid"></div></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');const root=document.getElementById('movies');if(!id){root.textContent='No playlist selected.';return}try{const r=await fetch('/api/playlists/public/'+id);if(!r.ok)throw Error();const p=await r.json();document.getElementById('title').textContent=p.title;document.getElementById('description').textContent=p.description||'';if(!p.movieIds.length){root.innerHTML='<div class="empty">This playlist is currently empty.</div>';return}const films=await Promise.all(p.movieIds.map(async movieId=>{const d=await fetch('/api/movies/'+movieId);return d.ok?d.json():{id:movieId,title:'Movie #'+movieId}}));root.innerHTML=films.map(m=>'<article class="movie-card"><img src="'+(m.poster_path?'https://image.tmdb.org/t/p/w500'+m.poster_path:'/missing-poster.svg')+'" alt=""><h3>'+String(m.title||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</h3><p>'+(m.release_date||'').slice(0,4)+'</p></article>').join('')}catch{root.textContent='This playlist is private or does not exist.'}})();
</script></body></html>
