spring.application.name=REELTRACK
server.port=8080

# H2 database is embedded; no separate database installation is needed.
spring.datasource.url=jdbc:h2:file:./data/reeltrack;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Add your TMDB API key here, or set the TMDB_API_KEY environment variable.
tmdb.api-key=a5a8ccb155f2af85e443ca4b2ea24d23
